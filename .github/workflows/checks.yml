name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check
      - run: npm run test:web
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/api/requirements-lock.txt
      - run: python -m pip install -r services/api/requirements-lock.txt
      - run: python -m pip install -r infra/requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
  research-browser:
    name: Authenticated research browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the pinned research-case candidate
        uses: actions/checkout@v7
        with:
          ref: 90bf6824f99811816356eb803e72e233fb590ac5
          path: .case-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r services/api/requirements-lock.txt -r infra/requirements-lock.txt playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - name: Rehearse authenticated research on the current revision
        run: python tests/browser/verify_research_portal.py --output "${{ runner.temp }}/ain-browser/current-revision.json"
      - name: Rehearse versioned case attachment on the pinned candidate
        run: python tests/browser/verify_research_portal.py --repository .case-source --case-workspace --output "${{ runner.temp }}/ain-browser/versioned-case.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aviation-research-browser-evidence
          path: ${{ runner.temp }}/ain-browser/
  containers:
    name: Container smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIN_RELEASE_REVISION: ${{ github.sha }}
      AIN_WEB_PORT: '8090'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: docker compose -p ain-ci build api web
      - run: docker compose -p ain-ci up -d --wait --wait-timeout 90 api web
      - run: python -m infra.verify_deployment --project ain-ci --port 8090
      - run: docker compose -p ain-ci exec -T api python -c "from services.api.segments import load_segments; r=load_segments(); assert r['integrity_verified'] and r['changed_routes']==875 and r['production_ready'] is False; print('Packaged route experiment verified')"
      - run: python -m infra.load_check --port 8090 --requests 12 --workers 2 --output /tmp/ain-http-measurement.json
      - run: docker compose -p ain-ci restart api
      - run: docker compose -p ain-ci up -d --wait --wait-timeout 90 api web
      - run: python -m infra.verify_deployment --project ain-ci --port 8090
      - if: always()
        run: docker compose -p ain-ci logs --tail 60 api web
      - if: always()
        run: docker compose -p ain-ci down
