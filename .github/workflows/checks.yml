name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check
      - run: npm run test:web
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/api/requirements-lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: python -m pip install -r services/api/requirements-lock.txt
      - run: python -m pip install -r infra/requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
  containers:
    name: Container smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIN_RELEASE_REVISION: ${{ github.sha }}
      AIN_WEB_PORT: '8090'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: docker compose -p ain-ci build api web
      - run: docker compose -p ain-ci up -d --wait --wait-timeout 90 api web
      - run: python -m infra.verify_deployment --project ain-ci --port 8090
      - run: docker compose -p ain-ci exec -T api python -m services.api.configuration
      - run: docker compose -p ain-ci exec -T web node scripts/check-environment.mjs
      - run: docker compose -p ain-ci exec -T api python -c "import urllib.request,uuid; supplied='11111111-1111-4111-8111-111111111111'; request=urllib.request.Request('http://127.0.0.1:8002/api/v1/auth/session',headers={'X-Request-ID':supplied}); response=urllib.request.urlopen(request,timeout=10); value=response.headers['X-Request-ID']; assert response.status==200 and uuid.UUID(value).version==4 and value!=supplied; print('Packaged server request ID verified')"
      - run: docker compose -p ain-ci exec -T api python -c "from services.api.segments import load_segments; r=load_segments(); assert r['integrity_verified'] and r['changed_routes']==875 and r['production_ready'] is False; print('Packaged route experiment verified')"
      - run: python -m infra.load_check --port 8090 --requests 12 --workers 2 --output /tmp/ain-http-measurement.json
      - run: docker compose -p ain-ci restart api
      - run: docker compose -p ain-ci up -d --wait --wait-timeout 90 api web
      - run: python -m infra.verify_deployment --project ain-ci --port 8090
      - if: always()
        run: docker compose -p ain-ci logs --tail 60 api web
      - if: always()
        run: docker compose -p ain-ci down
