name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check
      - run: npm run test:web
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/api/requirements-lock.txt
      - run: python -m pip install -r services/api/requirements-lock.txt
      - run: python -m pip install -r infra/requirements-lock.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
  containers:
    name: Container smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIN_RELEASE_REVISION: ${{ github.sha }}
      AIN_WEB_PORT: '8090'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: docker compose -p ain-ci build api web
      - run: docker compose -p ain-ci up -d --wait --wait-timeout 90 api web
      - run: python -m infra.verify_deployment --project ain-ci --port 8090
      - run: docker compose -p ain-ci restart api
      - run: docker compose -p ain-ci up -d --wait --wait-timeout 90 api web
      - run: python -m infra.verify_deployment --project ain-ci --port 8090
      - if: always()
        run: docker compose -p ain-ci logs --tail 60 api web
      - if: always()
        run: docker compose -p ain-ci down
