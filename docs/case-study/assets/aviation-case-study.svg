<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Aviation Intelligence Nexus architecture and research evidence</title>
<desc id="desc">Historical data supports frozen model experiments, scoped AI research and recoverable local state. The recorded dataset has 2,835,101 source flights. May delay-classifier ROC-AUC is 0.6506, while its chosen threshold has a high false-alert burden. A separate duration-regression experiment failed its research gate. Four current hosted CI jobs succeeded. All 24 production requirements remain open.</desc>
